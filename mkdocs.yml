site_name: Homelab
site_url: https://192.168.1.3
theme:
  features:
    - navigation.footer
  name: material
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  icon:
    logo: fontawesome/solid/o
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange
markdown_extensions:
  - tables
  - pymdownx.tasklist:
      clickable_checkbox: true
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview:
    - Welcome: index.md
    - Homelab: homelab.md
    - Todo: todo.md
    - Completed: completed.md
  - Infrastructure:
    - Proxmox: proxmox.md
    - Network Schema: network-schema.md
    - Network Context: network_context.md
    - Network Devices: network_devices.md
    - Network Diagram: network_diagram.md
    - Tailscale Reference: tailscale.md
    - Planned VLANS: vlan_ip_plan.md
    - Network Inventory: network_inventory.md
  - Hosts & Inventory:
    - Host: host.md
    - Hosts: hosts.md
    - Hardware Inventory: hw_inv.md
    - Hardware Reserve: hw_reserve.md
    - Backup Drive Rotation: backup_drives.md
    - Wishlist: wishlist.md
    - Docker Inventory: docker_inv.md
    - Software Inventory: software_inventory.md
    - Upgrade Radar: upgrade_radar.md
  - Monitoring & Reports:
    - Scan Results: scan_results.md
    - Disk Space: disk_space.md
    - System Info: system_info.md
    - Services: services.md
    - Ping Report: ping_report.md
    - User Audit: user_audit.md
  - Mediastack:
    - MediaStack Applications: mediastack_apps.md
    - Apps to Investigate: apps_to_investigate.md
  - Reference:
    - Git Commands: git.commands.md
    - Git Info: git_info.md
    - Code Examples: code-examples.md
    - Concerts: concerts.md
    - Albums: vinyl_collection.html
copyright: Copyright &copy; 2025 C. O'Shaughnessy as inspired by James Willett

extra_javascript:
  - javascripts/checkbox_persist.js

extra_css:
  - stylesheets/extra.css
