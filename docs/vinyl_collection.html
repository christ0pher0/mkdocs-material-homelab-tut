<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinyl Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a; --groove: #111111; --vinyl: #1a1a1a;
    --label-red: #c0392b; --label-yellow: #f39c12;
    --cream: #f5f0e8; --warm-white: #e8e0d0; --mid: #888880; --dim: #444440;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--warm-white); font-family: 'Space Mono', monospace; font-size: 13px; line-height: 1.5; }
  .header { background: var(--groove); border-bottom: 3px solid var(--label-red); padding: 2rem 2rem 1.5rem; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 6vw, 5rem); letter-spacing: 0.08em; color: var(--cream); line-height: 1; }
  .header h1 span { color: var(--label-red); }
  .stats-bar { display: flex; gap: 2rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--dim); }
  .stat { display: flex; flex-direction: column; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--label-yellow); line-height: 1; }
  .stat-label { font-size: 0.7rem; color: var(--mid); text-transform: uppercase; letter-spacing: 0.1em; }
  .controls { padding: 1rem 2rem; background: var(--vinyl); border-bottom: 1px solid var(--dim); display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap::before { content: '▶'; position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--label-red); font-size: 0.7rem; }
  input[type=text] { width: 100%; background: var(--black); border: 1px solid var(--dim); border-radius: 2px; color: var(--warm-white); font-family: 'Space Mono', monospace; font-size: 0.8rem; padding: 0.5rem 0.75rem 0.5rem 2rem; outline: none; transition: border-color 0.2s; }
  input[type=text]:focus { border-color: var(--label-red); }
  input[type=text]::placeholder { color: var(--dim); }
  select { background: var(--black); border: 1px solid var(--dim); border-radius: 2px; color: var(--warm-white); font-family: 'Space Mono', monospace; font-size: 0.8rem; padding: 0.5rem 0.75rem; outline: none; cursor: pointer; }
  .result-count { color: var(--mid); font-size: 0.75rem; white-space: nowrap; }
  .result-count span { color: var(--label-yellow); font-weight: bold; }
  .alpha-nav { padding: 0.5rem 2rem; background: var(--groove); border-bottom: 1px solid var(--dim); display: flex; gap: 0.25rem; flex-wrap: wrap; }
  .alpha-nav a { color: var(--mid); text-decoration: none; font-family: 'Bebas Neue', sans-serif; font-size: 1rem; padding: 0.1rem 0.3rem; transition: color 0.15s; }
  .alpha-nav a:hover { color: var(--label-yellow); }
  .section { margin: 0; border-bottom: 1px solid var(--dim); }
  .section-header { background: var(--vinyl); padding: 0.6rem 2rem; display: flex; align-items: baseline; gap: 0.75rem; cursor: pointer; user-select: none; border-left: 4px solid transparent; transition: border-color 0.15s, background 0.15s; }
  .section-header:hover { background: #222; border-left-color: var(--label-red); }
  .section-letter { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--label-red); line-height: 1; min-width: 1.5rem; }
  .section-count { color: var(--mid); font-size: 0.7rem; }
  .section-toggle { margin-left: auto; color: var(--dim); font-size: 0.7rem; transition: transform 0.2s; }
  .section.open .section-toggle { transform: rotate(90deg); }
  .section-body { display: none; overflow-x: auto; }
  .section.open .section-body { display: block; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; padding: 1rem 2rem; }
  .card { background: var(--groove); border: 1px solid var(--dim); border-radius: 3px; overflow: hidden; transition: border-color 0.15s, transform 0.15s; }
  .card:hover { border-color: var(--label-red); transform: translateY(-2px); }
  .card-art { width: 100%; aspect-ratio: 1; background: var(--vinyl); overflow: hidden; }
  .card-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-art .no-art { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .vinyl-placeholder { width: 70%; height: 70%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #2a2a2a, #0a0a0a); border: 2px solid #333; position: relative; }
  .vinyl-placeholder::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 25%; height: 25%; border-radius: 50%; background: var(--label-red); }
  .card-info { padding: 0.5rem; }
  .card-title { font-size: 0.72rem; color: var(--cream); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-artist { font-size: 0.65rem; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.1rem; }
  .card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 0.3rem; }
  .card-year { font-size: 0.65rem; color: var(--label-yellow); }
  .card-price { font-size: 0.65rem; color: var(--label-green); margin-top: 0.2rem; }
  .fmt-badge { display: inline-block; padding: 0.1rem 0.3rem; border-radius: 2px; font-size: 0.6rem; font-weight: bold; }
  .fmt-LP { background: #1a3a1a; color: #4caf50; border: 1px solid #2d5a2d; }
  .fmt-2xLP { background: #1a2a3a; color: #64b5f6; border: 1px solid #2d4a6a; }
  .fmt-3xLP { background: #2a1a3a; color: #ce93d8; border: 1px solid #4a2d6a; }
  .fmt-12 { background: #3a1a1a; color: #ef9a9a; border: 1px solid #6a2d2d; }
  .fmt-other { background: #2a2a1a; color: #fff176; border: 1px solid #5a5a2d; }
  .no-results { text-align: center; padding: 3rem; color: var(--dim); display: none; }
  .no-results.show { display: block; }
  .card.hidden { display: none; }
  .section.all-hidden { display: none; }
  .footer { padding: 2rem; text-align: center; color: var(--dim); font-size: 0.7rem; border-top: 1px solid var(--dim); margin-top: 2rem; }
</style>
</head>

": "LP", "year": "1982", "catalog": "GREL 49", "condition": "", "art": "vinyl_art/0193_Yellowman___Fathead__Purpleman__Sister_Nancy_The_Yellow__The_Purple__The_Na.jpg", "price": "$17.24", "sort": "YELLOWMAN & FATHEAD, PURPLEMAN, SISTER NANCY"}, {"artist": "Yes", "title": "Going For The One", "label": "Atlantic", "format": "LP", "year": "1977", "catalog": "SD 19106", "condition": "", "art": "vinyl_art/0050_Yes_Going_For_The_One.jpg", "price": "$6.03", "sort": "YES"}, {"artist": "Yes", "title": "The Yes Album", "label": "Atlantic", "format": "LP", "year": "1977", "catalog": "SD 19131", "condition": "", "art": "vinyl_art/0052_Yes_The_Yes_Album.jpg", "price": "$5.32", "sort": "YES"}, {"artist": "Yes", "title": "Tormato", "label": "Atlantic", "format": "LP", "year": "1978", "catalog": "KSD-19202", "condition": "", "art": "vinyl_art/0048_Yes_Tormato.jpg", "price": "$48.36", "sort": "YES"}];

function sortKey(a) {
  for (const p of ['The ','A ','An ']) if (a.startsWith(p)) { a = a.slice(p.length); break; }
  return a.toUpperCase();
}

// Calculate total collection value
const total = records.reduce((sum, r) => {
  if (r.price) sum += parseFloat(r.price.replace('$',''));
  return sum;
}, 0);
document.getElementById('totalVal').textContent = '$' + total.toFixed(0);

function fmtBadge(fmt) {
  if (fmt==='LP') return '<span class="fmt-badge fmt-LP">LP</span>';
  if (fmt==='2xLP') return '<span class="fmt-badge fmt-2xLP">2×LP</span>';
  if (fmt==='3xLP') return '<span class="fmt-badge fmt-3xLP">3×LP</span>';
  if (fmt.includes('12"')) return '<span class="fmt-badge fmt-12">12″</span>';
  return `<span class="fmt-badge fmt-other">${fmt}</span>`;
}

function imgError(el) { el.style.display = 'none'; }

function makeCard(r) {
  const artHTML = r.art
    ? `<img src="${r.art}" alt="" loading="lazy" onerror="imgError(this)">`
    : `<div class="no-art"><div class="vinyl-placeholder"></div></div>`;
  const discogsUrl = `https://www.discogs.com/search/?q=${encodeURIComponent(r.artist + ' ' + r.title)}&type=release`;
  const card = document.createElement('div');
  card.className = 'card';
  card.style.cursor = 'pointer';
  card.onclick = () => window.open(discogsUrl, '_blank');
  card.title = `${r.artist} — ${r.title}${r.price ? ' · ' + r.price : ''}`;
  card.dataset.artist = r.artist.toLowerCase();
  card.dataset.title = r.title.toLowerCase();
  card.dataset.label = r.label.toLowerCase();
  card.dataset.format = r.format;
  card.dataset.year = r.year || '0';
  card.dataset.price = r.price ? parseFloat(r.price.replace('$','')) : '0';
  card.innerHTML = `
    <div class="card-art">${artHTML}</div>
    <div class="card-info">
      <div class="card-title" title="${r.title}">${r.title}</div>
      <div class="card-artist">${r.artist}</div>
      <div class="card-meta">
        <span class="card-year">${r.year || '—'}</span>
        ${fmtBadge(r.format)}
      </div>
      ${r.price ? `<div style="font-size:0.65rem;color:#27ae60;margin-top:0.2rem;">${r.price}</div>` : ''}
    </div>
  `;
  return card;
}

// Build alpha sections
const byLetter = {};
for (const r of records) {
  const k = sortKey(r.artist);
  const letter = k[0]?.match(/[A-Z]/) ? k[0] : '#';
  if (!byLetter[letter]) byLetter[letter] = [];
  byLetter[letter].push(r);
}

const alphNav = document.getElementById('alphNav');
for (const letter of Object.keys(byLetter).sort()) {
  const a = document.createElement('a');
  a.href = '#sec-' + letter;
  a.textContent = letter;
  alphNav.appendChild(a);
}

const sectionsEl = document.getElementById('sections');
for (const letter of Object.keys(byLetter).sort()) {
  const items = byLetter[letter];
  const sec = document.createElement('div');
  sec.className = 'section open';
  sec.id = 'sec-' + letter;
  sec.innerHTML = `
    <div class="section-header" onclick="this.parentElement.classList.toggle('open')">
      <span class="section-letter">${letter}</span>
      <span class="section-count">${items.length} records</span>
      <span class="section-toggle">▶</span>
    </div>
    <div class="section-body"><div class="card-grid"></div></div>
  `;
  const grid = sec.querySelector('.card-grid');
  for (const r of items) grid.appendChild(makeCard(r));
  sectionsEl.appendChild(sec);
}

function filterAndSort() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const fmt = document.getElementById('fmtFilter').value;
  const sortBy = document.getElementById('sortBy').value;
  const isSorted = sortBy !== 'artist';

  const sectionsEl = document.getElementById('sections');
  const sortedView = document.getElementById('sortedView');
  const alphNavEl = document.getElementById('alphNav');

  // Filter all records
  let filtered = records.filter(r => {
    const matchQ = !q || r.artist.toLowerCase().includes(q) || r.title.toLowerCase().includes(q) || r.label.toLowerCase().includes(q);
    const matchFmt = !fmt || r.format.startsWith(fmt);
    return matchQ && matchFmt;
  });

  // Sort
  filtered.sort((a, b) => {
    if (sortBy === 'year_asc') return (a.year||'0').localeCompare(b.year||'0');
    if (sortBy === 'year_desc') return (b.year||'0').localeCompare(a.year||'0');
    if (sortBy === 'price_asc') return (parseFloat(a.price?.replace('$','')||0)) - (parseFloat(b.price?.replace('$','')||0));
    if (sortBy === 'price_desc') return (parseFloat(b.price?.replace('$','')||0)) - (parseFloat(a.price?.replace('$','')||0));
    if (sortBy === 'title') return a.title.localeCompare(b.title);
    return sortKey(a.artist).localeCompare(sortKey(b.artist));
  });

  document.getElementById('count').textContent = filtered.length;
  document.getElementById('noResults').classList.toggle('show', filtered.length === 0);

  if (isSorted || q || fmt) {
    // Show flat sorted grid
    sectionsEl.style.display = 'none';
    alphNavEl.style.display = 'none';
    sortedView.style.display = 'block';
    sortedView.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'card-grid';
    for (const r of filtered) grid.appendChild(makeCard(r));
    sortedView.appendChild(grid);
  } else {
    // Show alpha sections
    sectionsEl.style.display = 'block';
    alphNavEl.style.display = 'flex';
    sortedView.style.display = 'none';
    // Apply filter to sections
    document.querySelectorAll('.section').forEach(sec => {
      let secVisible = false;
      sec.querySelectorAll('.card').forEach(card => {
        const matchQ = !q || card.dataset.artist.includes(q) || card.dataset.title.includes(q) || card.dataset.label.includes(q);
        const matchFmt = !fmt || card.dataset.format.startsWith(fmt);
        if (matchQ && matchFmt) { card.classList.remove('hidden'); secVisible = true; }
        else card.classList.add('hidden');
      });
      sec.classList.toggle('all-hidden', !secVisible);
    });
  }
}

// alias for search input
function filterRecords() { filterAndSort(); }
